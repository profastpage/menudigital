<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión · MenuPro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #07070b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 480px;
      text-align: center;
    }
    .logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #ff6b35, #e63946);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ff6b35, #e63946);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      background: linear-gradient(135deg, #ff6b35, #e63946);
      color: #fff;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .retry-btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .retry-btn:active { transform: translateY(0); }
    .offline-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    .hint {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255, 107, 53, 0.1);
      border: 1px solid rgba(255, 107, 53, 0.2);
      border-radius: 12px;
      font-size: 0.875rem;
      color: #d1d5db;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">M</div>
    <div class="offline-icon">📡</div>
    <h1>Sin conexión a internet</h1>
    <p>
      No pudimos cargar esta página. Revisa tu conexión Wi-Fi o datos móviles e inténtalo de nuevo.
    </p>
    <button class="retry-btn" onclick="location.reload()">
      Reintentar
    </button>
    <div class="hint">
      💡 <strong>Modo offline Premium:</strong> Si eres mozo en un plan Premium o superior, tus comandas pendientes se seguirán guardando y se enviarán automáticamente cuando vuelva la conexión.
    </div>
  </div>
  <script>
    // Auto-reintentar cuando vuelva la conexión
    window.addEventListener('online', () => {
      location.reload();
    });
  </script>
</body>
</html>
