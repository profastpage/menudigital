<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Menús Digitales</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  .header-top {
    text-align: center;
    margin-bottom: 30px;
    padding: 30px 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
  }
  .header-top h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ff6b35, #ffd60a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-top p {
    color: #aaa;
    font-size: 14px;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-title .num {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #ff6b35, #ffd60a);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #ccc;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field label .req { color: #ff6b35; }
  .field input, .field textarea {
    width: 100%;
    padding: 12px 14px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    transition: border 0.2s;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: #ff6b35;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field .hint { font-size: 11px; color: #777; margin-top: 4px; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  .color-swatch {
    aspect-ratio: 1;
    border-radius: 12px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.2s;
    position: relative;
  }
  .color-swatch.selected {
    border-color: #fff;
    transform: scale(1.05);
  }
  .color-swatch.selected::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .category {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .category-head {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .category-head input { flex: 1; }
  .btn-icon {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    width: 42px; height: 42px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.12); }
  .btn-icon.danger:hover { background: rgba(230,57,70,0.3); border-color: #e63946; }
  .dish-row {
    display: grid;
    grid-template-columns: 1fr 1fr 100px 40px;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .dish-row input {
    padding: 9px 11px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
  }
  .dish-row input:focus { outline: none; border-color: #ff6b35; }
  .dish-full {
    grid-column: 1 / -1;
  }
  .btn-add-dish, .btn-add-cat {
    background: rgba(255,107,53,0.15);
    border: 1px dashed rgba(255,107,53,0.5);
    color: #ff6b35;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    font-size: 13px;
    font-weight: 600;
    margin-top: 6px;
    transition: all 0.2s;
  }
  .btn-add-dish:hover, .btn-add-cat:hover {
    background: rgba(255,107,53,0.25);
  }
  .btn-generate {
    width: 100%;
    background: linear-gradient(135deg, #ff6b35, #ffd60a);
    color: #fff;
    border: none;
    padding: 18px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(255,107,53,0.3);
  }
  .btn-generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(255,107,53,0.45);
  }
  .btn-generate:active { transform: translateY(0); }
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: #06d6a0;
    color: #fff;
    padding: 14px 24px;
    border-radius: 12px;
    font-weight: 600;
    box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    transition: transform 0.3s;
    z-index: 1000;
  }
  .toast.visible { transform: translateX(-50%) translateY(0); }
  .toast.error { background: #e63946; }
  @media (max-width: 600px) {
    .dish-row {
      grid-template-columns: 1fr 1fr;
    }
    .dish-row .price-input { grid-column: 1; }
    .dish-row .remove-dish { grid-column: 2; }
    .colors { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header-top">
    <h1>Generador de Menús Digitales</h1>
    <p>Crea un menú digital profesional con carrito y WhatsApp en minutos</p>
  </div>

  <div class="card">
    <div class="card-title"><span class="num">1</span> Información del restaurante</div>
    <div class="field">
      <label>Nombre del restaurante <span class="req">*</span></label>
      <input type="text" id="rName" placeholder="Ej: La Parrilla del Chef">
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="rDesc" placeholder="Ej: Auténtica cocina peruana con ingredientes frescos"></textarea>
    </div>
    <div class="field">
      <label>Número de WhatsApp con código de país <span class="req">*</span></label>
      <input type="text" id="rWhatsapp" placeholder="Ej: 51987654321">
      <div class="hint">Solo números, sin + ni espacios. Ej: 51 para Perú, 34 para España, 52 para México</div>
    </div>
    <div class="field">
      <label>URL del logo (opcional)</label>
      <input type="text" id="rLogo" placeholder="https://...logo.png">
    </div>
    <div class="field">
      <label>Color principal</label>
      <div class="colors" id="colors"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="num">2</span> Categorías y platos</div>
    <div id="categories"></div>
    <button class="btn-add-cat" onclick="addCategory()">+ Agregar categoría</button>
  </div>

  <div class="card">
    <div class="card-title"><span class="num">3</span> Generar menú</div>
    <button class="btn-generate" onclick="generateMenu()">Generar Menú Digital</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== Color palette ======
var COLORS = [
  { hex: '#ff6b35', name: 'Naranja' },
  { hex: '#e63946', name: 'Rojo' },
  { hex: '#06d6a0', name: 'Verde' },
  { hex: '#118ab2', name: 'Azul' },
  { hex: '#9d4edd', name: 'Morado' },
  { hex: '#ffd60a', name: 'Amarillo' }
];
var selectedColor = COLORS[0].hex;

function renderColors() {
  var container = document.getElementById('colors');
  var html = '';
  COLORS.forEach(function(c) {
    var sel = c.hex === selectedColor ? ' selected' : '';
    html += '<div class="color-swatch' + sel + '" style="background:' + c.hex + '" data-color="' + c.hex + '" title="' + c.name + '"></div>';
  });
  container.innerHTML = html;
  container.querySelectorAll('.color-swatch').forEach(function(el) {
    el.addEventListener('click', function() {
      selectedColor = this.dataset.color;
      renderColors();
    });
  });
}

// ====== Categories & dishes ======
var categoryCounter = 0;

function addCategory(name) {
  var id = 'cat_' + (categoryCounter++);
  var wrap = document.createElement('div');
  wrap.className = 'category';
  wrap.id = id;
  wrap.innerHTML =
    '<div class="category-head">' +
      '<input type="text" class="cat-name" placeholder="Nombre de categoría (Ej: Entradas)">' +
      '<button class="btn-icon danger" onclick="removeElement(\'' + id + '\')" title="Eliminar categoría">×</button>' +
    '</div>' +
    '<div class="dishes"></div>' +
    '<button class="btn-add-dish" onclick="addDish(\'' + id + '\')">+ Agregar plato</button>';
  document.getElementById('categories').appendChild(wrap);
  if (name) wrap.querySelector('.cat-name').value = name;
  addDish(id);
  return id;
}

function addDish(catId) {
  var cat = document.getElementById(catId);
  var dishes = cat.querySelector('.dishes');
  var id = 'dish_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
  var row = document.createElement('div');
  row.className = 'dish-row';
  row.id = id;
  row.innerHTML =
    '<input type="text" class="d-name dish-full" placeholder="Nombre del plato">' +
    '<input type="text" class="d-desc dish-full" placeholder="Descripción">' +
    '<input type="text" class="d-img dish-full" placeholder="URL de imagen">' +
    '<input type="number" class="d-price price-input" placeholder="S/ 0.00" step="0.10" min="0">' +
    '<button class="btn-icon danger remove-dish" onclick="removeElement(\'' + id + '\')" title="Eliminar plato">×</button>';
  dishes.appendChild(row);
}

function removeElement(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
}

// ====== Toast ======
function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '') + ' visible';
  setTimeout(function() { t.className = 'toast' + (isError ? ' error' : ''); }, 3000);
}

// ====== Validation & data collection ======
function collectData() {
  var name = document.getElementById('rName').value.trim();
  var whatsapp = document.getElementById('rWhatsapp').value.trim();
  if (!name) { showToast('Ingresa el nombre del restaurante', true); return null; }
  if (!whatsapp) { showToast('Ingresa el número de WhatsApp', true); return null; }
  if (!/^\d{8,15}$/.test(whatsapp)) { showToast('WhatsApp inválido. Solo dígitos, 8-15 números', true); return null; }

  var categories = [];
  var catEls = document.querySelectorAll('.category');
  if (catEls.length === 0) { showToast('Agrega al menos una categoría', true); return null; }

  for (var i = 0; i < catEls.length; i++) {
    var catName = catEls[i].querySelector('.cat-name').value.trim();
    if (!catName) { showToast('Toda categoría debe tener nombre', true); return null; }
    var dishes = [];
    var dishEls = catEls[i].querySelectorAll('.dish-row');
    for (var j = 0; j < dishEls.length; j++) {
      var dName = dishEls[j].querySelector('.d-name').value.trim();
      var dPrice = parseFloat(dishEls[j].querySelector('.d-price').value);
      if (!dName) { showToast('Todo plato debe tener nombre', true); return null; }
      if (isNaN(dPrice) || dPrice < 0) { showToast('Precio inválido en: ' + dName, true); return null; }
      dishes.push({
        name: dName,
        description: dishEls[j].querySelector('.d-desc').value.trim(),
        price: dPrice,
        image: dishEls[j].querySelector('.d-img').value.trim()
      });
    }
    if (dishes.length === 0) { showToast('La categoría "' + catName + '" necesita al menos un plato', true); return null; }
    categories.push({ name: catName, dishes: dishes });
  }

  return {
    name: name,
    description: document.getElementById('rDesc').value.trim(),
    whatsapp: whatsapp,
    logo: document.getElementById('rLogo').value.trim(),
    color: selectedColor,
    categories: categories
  };
}

// ====== Menu template builder ======
// IMPORTANT: Use string concatenation with + (no nested template literals)
// to avoid quoting issues. Restaurant data is injected via JSON.stringify().

function buildMenuHTML(data) {
  var css = MENU_CSS();
  var js = MENU_JS();
  var html = '';
  html += '<!DOCTYPE html>\n';
  html += '<html lang="es">\n';
  html += '<head>\n';
  html += '<meta charset="UTF-8">\n';
  html += '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
  html += '<title>' + escapeHtml(data.name) + '</title>\n';
  html += '<style>' + css + '</style>\n';
  html += '</head>\n';
  html += '<body>\n';
  html += '<div id="app"></div>\n';
  html += '<script>\n';
  html += 'var RESTAURANT = ' + JSON.stringify(data) + ';\n';
  html += 'document.documentElement.style.setProperty("--accent", "' + data.color + '");\n';
  html += js + '\n';
  html += '</scr' + 'ipt>\n'; // split to avoid breaking this script
  html += '</body>\n';
  html += '</html>';
  return html;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

}

// ====== Generate & download ======
function generateMenu() {
  var data = collectData();
  if (!data) return;
  try {
    var html = buildMenuHTML(data);
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    var safeName = data.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'menu';
    a.download = 'menu-' + safeName + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    showToast('Menú generado con éxito');
  } catch (err) {
    showToast('Error: ' + err.message, true);
  }
}
