<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Parrilla del Chef</title>
<style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1a2e 100%);color:#fff;min-height:100vh;padding-bottom:120px;--accent:#ff6b35;}.header{padding:28px 20px 20px;text-align:center;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.08);}.logo{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:12px;border:3px solid var(--accent);box-shadow:0 4px 20px rgba(0,0,0,0.3);}.restaurant-name{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-0.5px;}.restaurant-desc{color:#aaa;font-size:14px;margin-bottom:14px;max-width:400px;margin-left:auto;margin-right:auto;}.open-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(6,214,160,0.15);color:#06d6a0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;}.open-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#06d6a0;animation:pulse 2s infinite;}@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}.nav{position:sticky;top:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.08);z-index:100;padding:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}.nav::-webkit-scrollbar{display:none;}.nav-inner{display:flex;gap:8px;padding:0 16px;}.nav-item{white-space:nowrap;padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:20px;color:#ccc;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;}.nav-item:hover{background:rgba(255,255,255,0.1);color:#fff;}.nav-item.active{background:var(--accent);color:#fff;border-color:var(--accent);}.section{padding:20px 16px 8px;}.section-title{font-size:20px;font-weight:700;margin-bottom:14px;padding-left:4px;border-left:3px solid var(--accent);padding-left:10px;}.dish{display:flex;gap:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px;margin-bottom:12px;transition:transform 0.2s,border-color 0.2s;animation:fadeIn 0.4s ease;}.dish:hover{border-color:rgba(255,255,255,0.15);}.dish:active{transform:scale(0.98);}@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}.dish-img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.05);}.dish-info{flex:1;min-width:0;display:flex;flex-direction:column;}.dish-name{font-size:16px;font-weight:600;margin-bottom:4px;}.dish-desc{font-size:13px;color:#999;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}.dish-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}.dish-price{font-size:17px;font-weight:700;color:var(--accent);}.add-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.2s;line-height:1;font-weight:400;}.add-btn:hover{transform:scale(1.15);}.add-btn:active{transform:scale(0.9);}.cart{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(140px);width:calc(100% - 32px);max-width:480px;background:var(--accent);color:#fff;border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,0.5);cursor:pointer;transition:transform 0.3s ease;z-index:90;}.cart.visible{transform:translateX(-50%) translateY(0);}.cart-left{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;}.cart-count{background:rgba(255,255,255,0.25);padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700;}.cart-total{font-size:18px;font-weight:800;}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end;justify-content:center;}.modal-overlay.visible{display:flex;}.modal{background:#1a1a2e;width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:24px 20px;max-height:85vh;overflow-y:auto;animation:slideUp 0.3s ease;}@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}.modal-title{font-size:22px;font-weight:700;margin-bottom:20px;text-align:center;}.cart-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.08);gap:10px;}.cart-item-info{flex:1;min-width:0;}.cart-item-name{font-weight:600;font-size:15px;margin-bottom:2px;}.cart-item-price{color:#999;font-size:13px;}.qty-control{display:flex;align-items:center;gap:10px;}.qty-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.1);color:#fff;border:none;cursor:pointer;font-size:18px;line-height:1;transition:background 0.2s;}.qty-btn:hover{background:rgba(255,255,255,0.2);}.qty{min-width:24px;text-align:center;font-weight:600;}.cart-item-total{font-weight:700;color:var(--accent);min-width:70px;text-align:right;}.cart-empty{text-align:center;padding:40px 0;color:#666;font-size:14px;}.cart-summary{margin-top:20px;padding-top:16px;border-top:2px solid rgba(255,255,255,0.1);}.summary-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:15px;color:#ccc;}.summary-total{font-size:20px;font-weight:700;margin-top:10px;color:#fff;}.summary-total .amount{color:var(--accent);}.wa-btn{width:100%;background:#25d366;color:#fff;border:none;padding:16px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 0.2s;}.wa-btn:hover{transform:translateY(-2px);}.wa-btn:active{transform:translateY(0);}.close-btn{width:100%;background:rgba(255,255,255,0.08);color:#fff;border:none;padding:12px;border-radius:12px;font-size:14px;cursor:pointer;margin-top:10px;transition:background 0.2s;}.close-btn:hover{background:rgba(255,255,255,0.14);}.qty-flash{animation:flash 0.4s ease;}@keyframes flash{0%{transform:scale(1);}50%{transform:scale(1.4);color:var(--accent);}100%{transform:scale(1);}}@media (min-width:600px){.dish{padding:16px;}.dish-img{width:100px;height:100px;}.restaurant-name{font-size:32px;}}</style>
</head>
<body>
<div id="app"></div>
<script>
var RESTAURANT = {"name":"La Parrilla del Chef","description":"Auténtica cocina peruana con ingredientes frescos del mercado. Especialistas en parrillas y mariscos.","whatsapp":"51987654321","logo":"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=200&h=200&fit=crop","color":"#ff6b35","categories":[{"name":"Entradas","dishes":[{"name":"Ceviche Clásico","description":"Pescado fresco marinado en limón, cebolla, cilantro y ají limo. Acompañado de camote y choclo.","price":28,"image":"https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=300&h=300&fit=crop"},{"name":"Causa Limeña","description":"Papa amarilla seasoned con ají amarillo, rellena de pollo y palta.","price":22,"image":"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=300&h=300&fit=crop"},{"name":"Anticuchos","description":"Brochetas de corazón de res marinadas en ají panca. 4 unidades.","price":25,"image":"https://images.unsplash.com/photo-1529543544282-ea669407fca3?w=300&h=300&fit=crop"}]},{"name":"Platos de Fondo","dishes":[{"name":"Lomo Saltado","description":"Salteado de lomo de res con cebolla, tomate y papas fritas. Servido con arroz blanco.","price":35,"image":"https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=300&h=300&fit=crop"},{"name":"Ají de Gallina","description":"Crema de pollo deshilachado en ají amarillo con nueces y parmesano. Acompañado de arroz.","price":30,"image":"https://images.unsplash.com/photo-1606491956689-2ea866880c84?w=300&h=300&fit=crop"},{"name":"Chaufa de Mariscos","description":"Arroz chaufa con camarones, calamares y pescado. Estilo peruano-chino.","price":38,"image":"https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=300&h=300&fit=crop"}]},{"name":"Bebidas","dishes":[{"name":"Chicha Morada","description":"Bebida tradicional de maíz morado con piña, canela y clavo.","price":8,"image":"https://images.unsplash.com/photo-1623083099089-c2a3e3dd5d71?w=300&h=300&fit=crop"},{"name":"Maracuyá Sour","description":"Coctel de maracuyá con pisco quequeperuano. Sin alcohol disponible.","price":18,"image":"https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300&h=300&fit=crop"},{"name":"Inca Kola","description":"Gaseosa peruana 500ml.","price":6,"image":"https://images.unsplash.com/photo-1624552184280-9e9631bbeee9?w=300&h=300&fit=crop"}]}]};
document.documentElement.style.setProperty("--accent", "#ff6b35");
var cart = [];
function escapeHtml(s){if(s==null)return "";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function formatPrice(n){return "S/ "+Number(n).toFixed(2);}
function renderApp(){
  var app=document.getElementById("app");
  var html="";
  html+="<header class=\"header\">";
  if(RESTAURANT.logo){html+="<img src=\""+escapeHtml(RESTAURANT.logo)+"\" class=\"logo\" alt=\"logo\" onerror=\"this.style.display=\"none\"\"/>";}
  html+="<h1 class=\"restaurant-name\">"+escapeHtml(RESTAURANT.name)+"</h1>";
  if(RESTAURANT.description){html+="<p class=\"restaurant-desc\">"+escapeHtml(RESTAURANT.description)+"</p>";}
  html+="<span class=\"open-badge\">Abierto ahora</span>";
  html+="</header>";
  html+="<nav class=\"nav\"><div class=\"nav-inner\" id=\"navInner\">";
  RESTAURANT.categories.forEach(function(cat,i){
    html+="<div class=\"nav-item"+(i===0?" active":"")+"\" data-idx=\""+i+"\">"+escapeHtml(cat.name)+"</div>";
  });
  html+="</div></nav>";
  RESTAURANT.categories.forEach(function(cat,i){
    html+="<section class=\"section\" id=\"cat-"+i+"\">";
    html+="<h2 class=\"section-title\">"+escapeHtml(cat.name)+"</h2>";
    cat.dishes.forEach(function(dish,j){
      html+="<div class=\"dish\">";
      if(dish.image){html+="<img src=\""+escapeHtml(dish.image)+"\" class=\"dish-img\" alt=\"\" onerror=\"this.style.display=\"none\"\"/>";}
      else{html+="<div class=\"dish-img\"></div>";}
      html+="<div class=\"dish-info\">";
      html+="<div class=\"dish-name\">"+escapeHtml(dish.name)+"</div>";
      if(dish.description){html+="<div class=\"dish-desc\">"+escapeHtml(dish.description)+"</div>";}
      html+="<div class=\"dish-bottom\">";
      html+="<div class=\"dish-price\">"+formatPrice(dish.price)+"</div>";
      html+="<button class=\"add-btn\" data-cat=\""+i+"\" data-dish=\""+j+"\" title=\"Agregar\">+</button>";
      html+="</div></div></div>";
    });
    html+="</section>";
  });
  html+="<div class=\"cart\" id=\"cartBar\">";
  html+="<div class=\"cart-left\"><span>Ver pedido</span><span class=\"cart-count\" id=\"cartCount\">0</span></div>";
  html+="<div class=\"cart-total\" id=\"cartTotal\">S/ 0.00</div>";
  html+="</div>";
  html+="<div class=\"modal-overlay\" id=\"modal\"><div class=\"modal\">";
  html+="<h2 class=\"modal-title\">Tu Pedido</h2>";
  html+="<div id=\"cartItems\"></div>";
  html+="<div class=\"cart-summary\" id=\"cartSummary\"></div>";
  html+="<button class=\"wa-btn\" id=\"waBtn\">Enviar Pedido por WhatsApp</button>";
  html+="<button class=\"close-btn\" id=\"closeBtn\">Seguir agregando</button>";
  html+="</div></div>";
  app.innerHTML=html;
  attachEvents();
  updateCart();
}
function attachEvents(){
  document.querySelectorAll(".add-btn").forEach(function(btn){
    btn.addEventListener("click",function(){
      addToCart(parseInt(this.dataset.cat),parseInt(this.dataset.dish));
    });
  });
  document.querySelectorAll(".nav-item").forEach(function(item){
    item.addEventListener("click",function(){
      document.querySelectorAll(".nav-item").forEach(function(n){n.classList.remove("active");});
      this.classList.add("active");
      var idx=parseInt(this.dataset.idx);
      var el=document.getElementById("cat-"+idx);
      if(el){var top=el.getBoundingClientRect().top+window.pageYOffset-70;window.scrollTo({top:top,behavior:"smooth"});}
    });
  });
  document.getElementById("cartBar").addEventListener("click",openModal);
  document.getElementById("closeBtn").addEventListener("click",closeModal);
  document.getElementById("waBtn").addEventListener("click",sendWhatsApp);
  document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});
  window.addEventListener("scroll",updateActiveNav);
}
function updateActiveNav(){
  var scrollPos=window.pageYOffset+100;
  var sections=document.querySelectorAll(".section");
  var activeIdx=0;
  for(var i=0;i<sections.length;i++){if(sections[i].offsetTop<=scrollPos)activeIdx=i;}
  document.querySelectorAll(".nav-item").forEach(function(n,i){n.classList.toggle("active",i===activeIdx);});
}
function addToCart(catIdx,dishIdx){
  var dish=RESTAURANT.categories[catIdx].dishes[dishIdx];
  var existing=null;
  for(var i=0;i<cart.length;i++){if(cart[i].catIdx===catIdx&&cart[i].dishIdx===dishIdx){existing=cart[i];break;}}
  if(existing){existing.qty++;}
  else{cart.push({catIdx:catIdx,dishIdx:dishIdx,name:dish.name,price:dish.price,qty:1});}
  updateCart();
}
function updateCart(){
  var count=0,total=0;
  cart.forEach(function(c){count+=c.qty;total+=c.price*c.qty;});
  document.getElementById("cartCount").textContent=count;
  document.getElementById("cartTotal").textContent=formatPrice(total);
  var cartBar=document.getElementById("cartBar");
  if(count>0){cartBar.classList.add("visible");}else{cartBar.classList.remove("visible");}
  renderCartItems();
}
function renderCartItems(){
  var container=document.getElementById("cartItems");
  var summary=document.getElementById("cartSummary");
  if(cart.length===0){
    container.innerHTML="<div class=\"cart-empty\">Tu carrito esta vacio</div>";
    summary.innerHTML="";
    return;
  }
  var html="";
  cart.forEach(function(item,i){
    html+="<div class=\"cart-item\">";
    html+="<div class=\"cart-item-info\">";
    html+="<div class=\"cart-item-name\">"+escapeHtml(item.name)+"</div>";
    html+="<div class=\"cart-item-price\">"+formatPrice(item.price)+" c/u</div>";
    html+="</div>";
    html+="<div class=\"qty-control\">";
    html+="<button class=\"qty-btn\" data-action=\"dec\" data-idx=\""+i+"\">-</button>";
    html+="<span class=\"qty\">"+item.qty+"</span>";
    html+="<button class=\"qty-btn\" data-action=\"inc\" data-idx=\""+i+"\">+</button>";
    html+="</div>";
    html+="<div class=\"cart-item-total\">"+formatPrice(item.price*item.qty)+"</div>";
    html+="</div>";
  });
  container.innerHTML=html;
  var total=0;cart.forEach(function(c){total+=c.price*c.qty;});
  summary.innerHTML="<div class=\"summary-row\"><span>Subtotal</span><span>"+formatPrice(total)+"</span></div>";
  summary.innerHTML+="<div class=\"summary-total\"><span>Total</span><span class=\"amount\">"+formatPrice(total)+"</span></div>";
  container.querySelectorAll(".qty-btn").forEach(function(btn){
    btn.addEventListener("click",function(){
      var idx=parseInt(this.dataset.idx);
      if(this.dataset.action==="inc"){cart[idx].qty++;}
      else{cart[idx].qty--;if(cart[idx].qty<=0)cart.splice(idx,1);}
      updateCart();
    });
  });
}
function openModal(){
  if(cart.length===0){return;}
  document.getElementById("modal").classList.add("visible");
}
function closeModal(){document.getElementById("modal").classList.remove("visible");}
function sendWhatsApp(){
  if(cart.length===0){return;}
  var msg="*Pedido - "+RESTAURANT.name+"*\n\n";
  cart.forEach(function(item){
    msg+=item.qty+"x "+item.name+" - "+formatPrice(item.price*item.qty)+"\n";
  });
  var total=0;cart.forEach(function(c){total+=c.price*c.qty;});
  msg+="\n*Total: "+formatPrice(total)+"*";
  var url="https://wa.me/"+RESTAURANT.whatsapp+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
}
renderApp();

</script>
</body>
</html>
