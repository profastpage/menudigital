function sendWhatsApp(){
  if(cart.length===0)return;
  var msg="*"+RESTAURANT.name+"*\n";
  if(RESTAURANT.slogan){msg+="_"+RESTAURANT.slogan+"_\n";}
  msg+="\n*PEDIDO*\n\n";
  cart.forEach(function(item){
    msg+="• "+item.qty+"x "+item.name+" — "+formatPrice(item.price*item.qty)+"\n";
    if(item.options&&item.options.length>0){msg+="   Extras: "+item.options.map(function(o){return o.name+(o.qty>1?" x"+o.qty:"");}).join(", ")+"\n";}
    if(item.note){msg+="   📝 "+item.note+"\n";}
  });
  var total=0;cart.forEach(function(c){total+=c.price*c.qty;});
  msg+="\n*TOTAL: "+formatPrice(total)+"*\n\n";
  msg+="Hola, quisiera confirmar este pedido por favor.";
  var url="https://wa.me/"+RESTAURANT.whatsapp+"?text="+encodeURIComponent(msg);
  try{if(navigator&&navigator.sendBeacon){navigator.sendBeacon("/api/track/whatsapp-click",new Blob([JSON.stringify({menu_id:RESTAURANT.id,source:"cart"})],{type:"application/json"}));}else{var x=new XMLHttpRequest();x.open("POST","/api/track/whatsapp-click",true);x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify({menu_id:RESTAURANT.id,source:"cart"}));}}catch(e){}
  try{
    var plan=(RESTAURANT.plan||"free");
    if(plan==="premium"||plan==="full"){
      var payload={
        menu_id:RESTAURANT.id,
        order_type:"para_llevar",
        items:cart.map(function(c){return {menu_item_id:(c.dishId||""),menu_item_name:c.name,menu_item_price:c.basePrice||c.price,quantity:c.qty,notes:c.note||null};}),
        customer_name:"",
        customer_phone:"",
        notes:"Pedido desde carta digital"
      };
      var cx=new XMLHttpRequest();
      cx.open("POST","/api/comandas/from-public-menu",true);
      cx.setRequestHeader("Content-Type","application/json");
      cx.onreadystatechange=function(){
        if(cx.readyState===4){
          try{
            var r=JSON.parse(cx.responseText||"{}");
            if(r&&r.ok){
              console.log("[comanda] interna creada:",r.order_number,"mozo:",r.waiter_id||"auto");
              showComandaToast(r.order_number,r.waiter_id?true:false);
            } else if(r&&r.code==="plan_not_eligible"){
              /* Free/Pro: solo WhatsApp, no mostrar toast */
            } else {
              console.warn("[comanda] error interna:",r);
            }
          }catch(e){console.warn("[comanda] parse error",e);}
        }
      };
      cx.send(JSON.stringify(payload));
    }
  }catch(e){console.warn("[comanda] dispatch error",e);}
  window.open(url,"_blank");
}

}

  var mq=window.matchMedia("(display-mode: standalone)");
  var updateInstallBtn=function(){
    var ib=document.getElementById("mbnInstallBtn");
    if(!ib)return;
    var isStandalone=mq.matches||window.navigator.standalone===true;
    if(isStandalone){ib.classList.add("installed");}
    else{ib.classList.remove("installed");}
  };
  updateInstallBtn();
  if(mq.addEventListener){mq.addEventListener("change",updateInstallBtn);}
  else if(mq.addListener){mq.addListener(updateInstallBtn);}
  // Re-check on focus (when user comes back from app switcher — may have uninstalled)
  window.addEventListener("focus",updateInstallBtn);
})();
(function(){
  var inner=document.getElementById("topCatsInner");
  if(!inner){return;}
  var html="";
  RESTAURANT.categories.forEach(function(cat,i){
    var icon=THEME.showSearch?getCategoryIcon(cat.name):"";
    html+="<div class=\"bcat-item"+(i===0?" active":"")+"\" data-idx=\""+i+"\">"+(icon?"<span class=\"bcat-item-icon\">"+icon+"</span>":"")+escapeHtml(cat.name)+"</div>";
  });
  inner.innerHTML=html;
  // Wire up click events for the new bottom-cats chips
  inner.querySelectorAll(".bcat-item").forEach(function(item){
    item.addEventListener("click",function(){
      var idx=parseInt(this.dataset.idx);
      document.querySelectorAll(".nav-item, .bcat-item").forEach(function(n){n.classList.remove("active");});
      document.querySelectorAll('.nav-item[data-idx="'+idx+'"], .bcat-item[data-idx="'+idx+'"]').forEach(function(n){n.classList.add("active");});
      var el=document.getElementById("cat-"+idx);
      if(el){var top=el.getBoundingClientRect().top+window.pageYOffset-70;window.scrollTo({top:top,behavior:"smooth"});}
      // Auto-scroll the top-cats-inner to make the clicked chip visible
      this.parentNode.scrollLeft=this.offsetLeft-(this.parentNode.offsetWidth/2)+(this.offsetWidth/2);
    });
  });
  // ─── Scroll spy: usa IntersectionObserver para detectar la categoría visible ───
  if("IntersectionObserver" in window){
    var sections=document.querySelectorAll(".section");
    var spy=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          var idx=Array.prototype.indexOf.call(sections,entry.target);
          if(idx<0)return;
          document.querySelectorAll(".nav-item, .bcat-item").forEach(function(n){n.classList.remove("active");});
          document.querySelectorAll('.nav-item[data-idx="'+idx+'"], .bcat-item[data-idx="'+idx+'"]').forEach(function(n){n.classList.add("active");});
          // Auto-scroll the top-cats-inner to center the active chip
          var activeChip=inner.querySelector('.bcat-item[data-idx="'+idx+'"]');
          if(activeChip&&activeChip.parentNode){activeChip.parentNode.scrollLeft=activeChip.offsetLeft-(activeChip.parentNode.offsetWidth/2)+(activeChip.offsetWidth/2);}
        }
      });
    },{rootMargin:"-70px 0px -60% 0px",threshold:0});
    sections.forEach(function(sec){spy.observe(sec);});
  }
})();

</script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" referrerpolicy="no-referrer" defer></script>
